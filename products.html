<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all seven toys available at Toy Haven.">
  <title>Toy Haven | Products</title>
  <link rel="icon" type="image/png" href="content/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="products">
  <a class="skip-link" href="#main-content">Skip</a>
  <div id="site-header"></div>

  <main id="main-content" class="section-shell page-section">
    <div class="page-intro">
      <p class="eyebrow">The entire bundle of joyness</p>
      <h1>Shop all toys</h1>
      <p>Use the simple filters to find the right toy, then save it or add it to your cart.</p>
    </div>

    <section class="catalogue-layout" aria-label="Toy catalogue">
      <aside class="filters">
        <h2>Filter toys</h2>
        <label for="search-products">Search</label>
        <input id="search-products" type="search" placeholder="Search by name">

        <label for="category-filter">Category</label>
        <select id="category-filter">
          <option value="all">All categories</option>
          <option value="Figures">Figures</option>
          <option value="Games">Games</option>
          <option value="Soft Toys">Soft Toys</option>
          <option value="Vehicles">Vehicles</option>
          <option value="Building Sets">Building Sets</option>
          <option value="Pretend Play">Pretend Play</option>
        </select>

        <label for="price-filter">Maximum price: <strong id="price-value">LKR 20,000</strong></label>
        <input id="price-filter" type="range" min="2500" max="20000" step="500" value="20000">

        <button id="clear-filters" class="button secondary-button full-button" type="button">Clear filters</button>
      </aside>

      <div class="catalogue-results">
        <div class="catalogue-toolbar">
          <p id="product-count">7 toys</p>
          <label for="sort-products">Sort by
            <select id="sort-products">
              <option value="featured">Featured</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="rating">Rating</option>
            </select>
          </label>
        </div>
        <div id="all-products" class="product-grid"></div>
        <div id="no-products" class="empty-state" hidden>
          <span aria-hidden="true">🔎</span>
          <h2>No toys found</h2>
          <p>Try another search or clear the filters.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="product-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" data-close-modal aria-label="Close product details">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
